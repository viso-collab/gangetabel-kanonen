<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Regnekanonen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Cherry+Swash:wght@700&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: wide desktop game cabinet — top bar (title, purse, shop), level strip, one big 5:3 stage (owl panel + peg board), solved-problem chips below. Single theme by choice; colors follow the equipped shop theme. */
:root {
  --bg: #120e2e;
  --bg-2: #2a2160;
  --panel: #33297a;
  --fg: #fff8ec;
  --muted: #c3b9ea;
  --pink: #ff7a2b;
  --yellow: #ffd23f;
  --teal: #3ee6c4;
  --font-title: "Cherry Swash", Georgia, serif;
  --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px;
  box-sizing: border-box;
}
#bgc { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
.app { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.bar { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; justify-content: space-between; }
h1 {
  font-family: var(--font-title); font-weight: 700; font-size: 2.2rem; line-height: 1; margin: 0;
  color: var(--yellow); text-shadow: 0 3px 0 #8a3a00, 0 0 18px rgba(255,210,63,.35); white-space: nowrap;
}
.levels { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
.levels > span { font-size: .85rem; color: var(--fg); margin-right: 6px; font-weight: 800; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
.levels button {
  font: 800 1rem var(--font-display); color: var(--fg); background: var(--panel);
  border: 2px solid transparent; border-radius: 10px; width: 40px; height: 40px; cursor: pointer; position: relative; padding: 0;
}
.levels button:hover:not(:disabled) { border-color: rgba(255,255,255,.4); }
.levels button[aria-pressed="true"] { background: var(--pink); border-color: var(--yellow); }
.levels button:disabled { opacity: .38; cursor: not-allowed; }
.levels button .st { position: absolute; bottom: -8px; left: 0; right: 0; font-size: .58rem; color: var(--yellow); letter-spacing: -1px; }
.stats { display: flex; gap: 8px; align-items: stretch; }
.stat { background: var(--panel); border-radius: 12px; padding: 4px 14px; text-align: center; min-width: 64px; }
.stat b { display: block; font-family: var(--font-display); font-size: 1.35rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.stat.coins b { color: var(--yellow); }
.shopbtn {
  font: 800 1.05rem var(--font-display); border: 0; border-radius: 12px; padding: 0 18px; cursor: pointer;
  background: var(--yellow); color: #3a2a00; box-shadow: 0 3px 0 #c89a00;
}
button:focus-visible, canvas:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
.stage {
  position: relative; align-self: center;
  width: min(100%, max(640px, calc((100vh - 220px) * 1.6667)));
  aspect-ratio: 1100 / 660; max-width: 100%;
}
canvas#c { width: 100%; height: 100%; display: block; border-radius: 20px; touch-action: manipulation; box-shadow: 0 14px 40px rgba(0,0,0,.5); }
.chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.chip {
  font: 800 1.05rem var(--font-display); text-align: center; padding: 6px 0; border-radius: 12px;
  background: rgba(20,14,50,.7); color: var(--muted); font-variant-numeric: tabular-nums;
  border: 2px solid transparent; transition: background .25s, color .25s;
}
.chip.now { border-color: var(--yellow); color: var(--fg); }
.chip.on { background: var(--pink); color: var(--fg); }
.ov {
  position: absolute; inset: 0; border-radius: 20px; background: rgba(10,8,30,.82);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px;
}
.ov h2 { font-family: var(--font-title); font-size: 2.8rem; margin: 0; color: var(--yellow); text-wrap: balance; line-height: 1.1; }
.ov p { margin: 0; color: var(--fg); max-width: 42ch; line-height: 1.5; font-size: 1.1rem; }
.ov .stars { font-size: 3rem; color: var(--yellow); letter-spacing: 6px; }
.ov .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.ov button {
  font: 800 1.25rem var(--font-display); border: 0; border-radius: 14px; padding: 12px 26px; cursor: pointer;
  background: var(--pink); color: var(--fg); box-shadow: 0 4px 0 #a8400f;
}
.ov button.alt { background: var(--panel); box-shadow: 0 4px 0 rgba(0,0,0,.35); }
.shop {
  position: absolute; inset: 0; border-radius: 20px; background: var(--bg); overflow-y: auto;
  padding: 22px 26px; display: flex; flex-direction: column; gap: 16px; box-sizing: border-box;
}
.shop-head { display: flex; align-items: center; gap: 16px; }
.shop-head h2 { font-family: var(--font-title); margin: 0; font-size: 2rem; color: var(--yellow); flex: 1; }
.shop-head .wallet { font-weight: 800; color: var(--yellow); font-variant-numeric: tabular-nums; font-size: 1.1rem; }
.shop h3 { margin: 0 0 8px; font-size: .75rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.item {
  background: var(--panel); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 8px;
  border: 2px solid transparent;
}
.item.eq { border-color: var(--teal); }
.item .sw { width: 60px; height: 60px; border-radius: 50%; }
.item .nm { font-weight: 800; }
.item button {
  width: 100%; font: 800 .85rem var(--font-body); border: 0; border-radius: 8px; padding: 7px 0; cursor: pointer;
  background: var(--pink); color: var(--fg);
}
.item button.own { background: var(--bg-2); }
.item button:disabled { background: rgba(255,255,255,.08); color: var(--muted); cursor: default; }
.close { font: 800 1rem var(--font-display); border: 0; border-radius: 12px; padding: 8px 18px; cursor: pointer; background: var(--pink); color: var(--fg); }
.help { font-size: .85rem; color: var(--fg); text-align: center; margin: 0; line-height: 1.5; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
.mute { background: none; border: 0; color: var(--fg); font: inherit; cursor: pointer; text-decoration: underline; }
@media (max-width: 700px) { h1 { font-size: 1.6rem; } .chip { font-size: .85rem; } }
@media (prefers-reduced-motion: reduce) { .chip { transition: none; } }
</style>
</head>
<body>

<canvas id="bgc" aria-hidden="true"></canvas>
<div class="app">
  <div class="bar">
    <h1>Regnekanonen</h1>
    <div class="stats">
      <div class="stat"><b id="score">0</b><span>Point</span></div>
      <div class="stat coins"><b id="coins">0</b><span>Mønter</span></div>
      <button class="shopbtn" id="openShop">Butik</button>
    </div>
  </div>
  <div class="levels" id="levels" role="group" aria-label="Vælg level"><span>Level</span></div>
  <div class="stage">
    <canvas id="c" width="1100" height="660" aria-label="Spillebane med svarkugler. Klik på kuglen med det rigtige svar. Piletaster vælger en kugle, Enter skyder, U bruger Uglesyn."></canvas>
    <div class="ov" id="ov" hidden></div>
    <div class="shop" id="shop" hidden></div>
  </div>
  <div class="chips" id="chips"></div>
  <p class="help">Klik på kuglen med det rigtige svar, så skyder kanonen på den. Tre forkerte, og du starter levelet forfra. Hver rigtig fylder uglens månekugle, og når den er fuld, kan du klikke på uglen. Rammer kuglen spanden, får du 25 bonusmønter. <button class="mute" id="mute">Lyd: til</button></p>
</div>

<script>
(() => {
  const W = 1100, H = 660;
  const BX0 = 262, BX1 = 1088, CX = (BX0 + BX1) / 2, CY = 54;
  const G = 1000, BALL_R = 10, PEG_R = 36, BUCKET_Y = 614, BUCKET_W = 100;
  const OWL = { x: 128, y: 318 };
  const POWER_MAX = 3;
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  const $ = id => document.getElementById(id);

  // ---------- the 20 levels (fixed problems, shuffled order) ----------
  const LEVELS = [
    [[2, "+", 3], [4, "+", 1], [3, "+", 3]],
    [[5, "+", 2], [6, "+", 3], [4, "+", 4]],
    [[7, "+", 2], [8, "+", 1], [5, "+", 4]],
    [[12, "+", 5], [23, "+", 4], [31, "+", 7]],
    [[14, "+", 12], [25, "+", 13], [32, "+", 21]],
    [[27, "+", 15], [38, "+", 24], [46, "+", 19]],
    [[8, "-", 3], [9, "-", 5], [7, "-", 4]],
    [[15, "-", 4], [18, "-", 7], [26, "-", 5]],
    [[34, "-", 12], [47, "-", 23], [52, "-", 18]],
    [[36, "+", 27], [64, "-", 29], [45, "+", 38]],
    [[2, "×", 3], [5, "×", 2], [10, "×", 4]],
    [[2, "×", 7], [5, "×", 6], [10, "×", 8]],
    [[3, "×", 4], [4, "×", 5], [3, "×", 8]],
    [[6, "×", 3], [4, "×", 7], [6, "×", 6]],
    [[7, "×", 7], [8, "×", 6], [9, "×", 4]],
    [[7, "×", 8], [9, "×", 6], [8, "×", 9]],
    [[6, "×", 7], [72, "-", 35], [48, "+", 37]],
    [[9, "×", 9], [83, "-", 47], [8, "×", 7]],
    [[56, "+", 68], [91, "-", 46], [7, "×", 9]],
    [[8, "×", 8], [125, "-", 48], [6, "×", 9]],
  ];
  const calc = (a, op, b) => op === "+" ? a + b : op === "-" ? a - b : a * b;
  const sym = op => op === "-" ? "−" : op;
  const ptext = p => `${p.a} ${sym(p.op)} ${p.b}`;
  const NEW_OP = { 7: "Nu kommer minus! Når man trækker fra, bliver tallet mindre.", 11: "Nu kommer gange! 2 × 3 betyder 2 + 2 + 2.", 17: "Nu blander vi plus, minus og gange. Kig godt på tegnet!" };

  let level = 1, probs = [], pi = 0, prob = null, solved = [];
  let pegs = [], shot = null, fallers = [], streak = 0, mistakes = 0, score = 0;
  let particles = [], floats = [], phase = "play", angle = Math.PI / 2, time = 0, betweenT = 0, signPop = 1;
  let timeScale = 1, zoom = { x: CX, y: H / 2, z: 1, target: 1 }, hover = -1, clearT = 0, clearQueue = [], fireworkT = 0;
  let power = 0;
  const owl = { mood: "idle", moodT: 0, blinkT: 2, hop: 0, lookX: 0, lookY: 0 };
  let speech = { text: "", t: 0 };
  let best = {};
  try { best = JSON.parse(localStorage.getItem("gk-lv") || "{}") || {}; } catch (e) { best = {}; }

  // ---------- sound ----------
  let ac = null, soundOn = true;
  function tone(f, d = .12, type = "sine", v = .15, slide = 0) {
    if (!soundOn) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      o.type = type; o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + d);
      g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d);
    } catch (e) {}
  }
  $("mute").onclick = () => { soundOn = !soundOn; $("mute").textContent = "Lyd: " + (soundOn ? "til" : "fra"); };

  // ---------- cosmetics & coins ----------
  const SHOP = {
    theme: { label: "Farvetemaer", items: {
      nat:    { name: "Eventyrnat", price: 0,    sky: ["#3b2a7a", "#e07a8f"], far: "#5b4a9e", mid: "#3a2c70", near: "#1c1640", ground: "#140f30", mist: "#ffd6f0", fly: "#fff27a", peg: "#4a8dff", moon: "#fff3c4", page: ["#2a2160", "#120e2e", "#33297a"] },
      hav:    { name: "Havbund",    price: 300,  sky: ["#0d6e9c", "#4fd1c5"], far: "#0e5f86", mid: "#0a4a6b", near: "#06324a", ground: "#042436", mist: "#c8fff6", fly: "#9ffcff", peg: "#ff8a5c", moon: "#e8fbff", page: ["#0f4c75", "#06263d", "#16618f"] },
      jungle: { name: "Junglen",    price: 500,  sky: ["#2f8f5a", "#f2d27a"], far: "#4f9a5a", mid: "#2d6e3a", near: "#163f1f", ground: "#0e2a15", mist: "#f0ffd6", fly: "#e6ff6a", peg: "#b56bff", moon: "#fff59d", page: ["#2a6b35", "#102b16", "#2f7d3d"] },
      slik:   { name: "Slikland",   price: 700,  sky: ["#ff9ecb", "#ffe0a3"], far: "#f77fb6", mid: "#d65b9c", near: "#a8407a", ground: "#7d2c5a", mist: "#ffffff", fly: "#ffffff", peg: "#4a5cff", moon: "#ffffff", page: ["#c95f9f", "#6e2650", "#a8498a"] },
      rum:    { name: "Rummet",     price: 1000, sky: ["#080826", "#3a1a6e"], far: "#2a1d5e", mid: "#1d1446", near: "#100b2c", ground: "#07051a", mist: "#b8a8ff", fly: "#7af5ff", peg: "#ff3df0", moon: "#c9b8ff", page: ["#1a1446", "#05051a", "#241c5e"] },
    } },
    ball: { label: "Kugler", items: {
      hvid:    { name: "Sølv",    price: 0,   col: "#e8eef7", glow: "#9fd3ff" },
      guld:    { name: "Guld",    price: 200, col: "#ffd23f", glow: "#ffb03f" },
      stjerne: { name: "Stjerne", price: 350, col: "#fff23d", glow: "#ffffff", star: true },
      ild:     { name: "Ild",     price: 450, col: "#ff8a3f", glow: "#ff3d00", trail: true },
      regnbue: { name: "Regnbue", price: 800, col: "rainbow", glow: "#ffffff", trail: true },
    } },
    cannon: { label: "Kanoner", items: {
      klassisk: { name: "Klassisk", price: 0,   barrel: "#c7d3e3", base: "#5b6b82" },
      mint:     { name: "Mint",     price: 150, barrel: "#3ee6c4", base: "#1f9e86" },
      lilla:    { name: "Lilla",    price: 150, barrel: "#c86bff", base: "#6b3dd6" },
      guld:     { name: "Guld",     price: 400, barrel: "#fff1a8", base: "#e0a800" },
    } },
  };
  let save = { coins: 0, owned: ["theme:nat", "ball:hvid", "cannon:klassisk"], eq: { theme: "nat", ball: "hvid", cannon: "klassisk" }, unlocked: 1 };
  try { const s = JSON.parse(localStorage.getItem("gk-save") || "null"); if (s && s.eq && Array.isArray(s.owned)) save = Object.assign(save, s); } catch (e) {}
  if (!(save.unlocked >= 1)) save.unlocked = 1;
  const persist = () => { try { localStorage.setItem("gk-save", JSON.stringify(save)); } catch (e) {} };
  const cur = cat => SHOP[cat].items[save.eq[cat]] || Object.values(SHOP[cat].items)[0];
  function addCoins(n) { save.coins += n; $("coins").textContent = save.coins; persist(); }
  function applyTheme() {
    const t = cur("theme"), r = document.documentElement.style;
    r.setProperty("--bg-2", t.page[0]); r.setProperty("--bg", t.page[1]); r.setProperty("--panel", t.page[2]);
    sceneKey = "";
  }

  let shopOpen = false;
  function swatch(cat, it) {
    if (cat === "theme") return `background: linear-gradient(180deg, ${it.sky[0]}, ${it.sky[1]} 60%, ${it.near} 60%); box-shadow: inset 0 0 0 6px ${it.peg}99`;
    if (cat === "ball") return it.col === "rainbow" ? "background: conic-gradient(#ff5fa2,#ffd23f,#3ee6c4,#7a8cff,#ff5fa2)" : `background: radial-gradient(circle at 35% 35%, #fff, ${it.col}); box-shadow: 0 0 12px ${it.glow}`;
    return `background: linear-gradient(90deg, ${it.base} 50%, ${it.barrel} 50%)`;
  }
  function renderShop() {
    const el = $("shop");
    let h = `<div class="shop-head"><h2>Uglens butik</h2><span class="wallet">${save.coins} mønter</span><button class="close" id="closeShop">Luk</button></div>`;
    for (const cat in SHOP) {
      h += `<section><h3>${SHOP[cat].label}</h3><div class="items">`;
      for (const id in SHOP[cat].items) {
        const it = SHOP[cat].items[id], key = cat + ":" + id, owned = save.owned.includes(key), on = save.eq[cat] === id;
        let btn;
        if (on) btn = `<button class="own" disabled>I brug</button>`;
        else if (owned) btn = `<button class="own" data-use="${key}">Brug</button>`;
        else if (save.coins >= it.price) btn = `<button data-buy="${key}">Køb ${it.price}</button>`;
        else btn = `<button disabled>${it.price} mønter</button>`;
        h += `<div class="item${on ? " eq" : ""}"><div class="sw" style="${swatch(cat, it)}"></div><div class="nm">${it.name}</div>${btn}</div>`;
      }
      h += `</div></section>`;
    }
    el.innerHTML = h;
    $("closeShop").onclick = closeShop;
    el.querySelectorAll("[data-use],[data-buy]").forEach(b => b.onclick = () => {
      const key = b.dataset.use || b.dataset.buy, [cat, id] = key.split(":");
      if (b.dataset.buy) {
        const price = SHOP[cat].items[id].price;
        if (save.coins < price) return;
        save.coins -= price; save.owned.push(key);
        [659, 880, 1175].forEach((f, i) => setTimeout(() => tone(f, .15, "triangle", .16), i * 80));
      } else tone(660, .08);
      save.eq[cat] = id; persist(); applyTheme();
      $("coins").textContent = save.coins; renderShop();
      const eqBtn = $("shop").querySelector(".item.eq button"); if (eqBtn) eqBtn.focus();
    });
  }
  function openShop() { shopOpen = true; renderShop(); $("shop").hidden = false; $("closeShop").focus(); }
  function closeShop() { shopOpen = false; $("shop").hidden = true; cv.focus(); }
  $("openShop").onclick = () => shopOpen ? closeShop() : openShop();

  // ---------- UI ----------
  function renderLevels() {
    const p = $("levels");
    p.querySelectorAll("button").forEach(b => b.remove());
    for (let n = 1; n <= LEVELS.length; n++) {
      const b = document.createElement("button");
      b.setAttribute("aria-pressed", n === level ? "true" : "false");
      b.disabled = n > save.unlocked;
      b.title = b.disabled ? `Klar level ${n - 1} for at åbne` : `Level ${n}`;
      b.innerHTML = n + (best[n] ? `<span class="st">${"★".repeat(best[n])}</span>` : "");
      b.onclick = () => { if (n <= save.unlocked) startLevel(n); };
      p.appendChild(b);
    }
  }
  function renderChips() {
    const c = $("chips"); c.innerHTML = "";
    for (let k = 0; k < 3; k++) {
      const d = document.createElement("div");
      d.className = "chip" + (solved[k] ? " on" : k === pi ? " now" : "");
      d.textContent = solved[k] || (k === pi && prob ? `${ptext(prob)} = ?` : `Regnestykke ${k + 1}`);
      c.appendChild(d);
    }
  }
  function renderStats() { $("score").textContent = score; }

  // ---------- owl talk ----------
  const PRAISE = ["Hu-hu, rigtigt!", "Flot regnet!", "Du er klog som en ugle!", "Præcis!", "Sådan!", "Godt tænkt!"];
  function say(text, dur = 4.5) { speech = { text, t: dur }; }
  function mood(m, t = 1.2) { owl.mood = m; owl.moodT = t; if (m === "happy") owl.hop = 1; }
  function hint(p) {
    if (p.op === "+") return p.b <= 10 ? `Start ved ${p.a} og tæl ${p.b} frem.` : `Læg tierne sammen først, og så enerne.`;
    if (p.op === "-") return p.b <= 10 ? `Start ved ${p.a} og tæl ${p.b} tilbage.` : `Træk tierne fra først, og så enerne.`;
    return `${p.a} × ${p.b} er ${p.b} grupper med ${p.a} i hver. Tæl ${p.a} frem ${p.b} gange.`;
  }

  // ---------- levels & problems ----------
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
  function distractors(p) {
    const a = p.ans, out = new Set();
    const c = [a + 1, a - 1, a + 2, a - 2, a + 3, a - 3];
    if (a >= 10) c.push(a + 10, a - 10);
    if (p.op === "×") c.push(p.a * (p.b + 1), p.a * (p.b - 1), (p.a + 1) * p.b, p.a + p.b);
    if (p.op === "+") c.push(Math.abs(p.a - p.b));
    if (p.op === "-") c.push(p.a + p.b);
    for (const v of shuffle(c)) { if (out.size >= 4) break; if (v >= 0 && v !== a) out.add(v); }
    let k = 4; while (out.size < 4) { const v = a + k++; if (v !== a) out.add(v); }
    return [...out];
  }
  function scatter(n) {
    for (let attempt = 0; attempt < 50; attempt++) {
      const pts = [];
      for (let tries = 0; tries < 2000 && pts.length < n; tries++) {
        const x = BX0 + 70 + Math.random() * (BX1 - BX0 - 140), y = 230 + Math.random() * 300;
        if (pts.every(([px, py]) => Math.hypot(px - x, py - y) > 2 * PEG_R + 60)) pts.push([x, y]);
      }
      if (pts.length === n) return pts;
    }
    return Array.from({ length: n }, (_, i) => [BX0 + 110 + i * 150, 380]);
  }
  function startLevel(n) {
    level = n;
    probs = shuffle(LEVELS[n - 1].map(([a, op, b]) => ({ a, op, b, ans: calc(a, op, b) })));
    pi = 0; solved = []; streak = 0; mistakes = 0; score = 0;

  function useOwlPower() {

    mood("happy", 1.4);

    if (p.ok) {

      solved[pi] = `${ptext(prob)} = ${prob.ans}`;

      ctx.globalAlpha = Math.min(1, (clearT - .3) * 2);
      ctx.font = '700 72px "Cherry Swash", Georgia, serif';
      const tg = ctx.createLinearGradient(CX - 220, 0, CX + 220, 0);
      for (let i = 0; i <= 6; i++) tg.addColorStop(i / 6, `hsl(${(i * 60 + time * 200) % 360},95%,62%)`);
      ctx.lineWidth = 10; ctx.strokeStyle = "rgba(10,8,30,.85)"; ctx.strokeText(`LEVEL ${level}!`, CX, 330);
      ctx.fillStyle = tg; ctx.fillText(`LEVEL ${level}!`, CX, 330);
      ctx.globalAlpha = 1;
    }
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
    try {
      if (!shopOpen) for (let i = 0; i < 4; i++) step(dt * timeScale / 4);
      resize();
      draw();
    } catch (err) { console.error(err); }
    requestAnimationFrame(loop);
  }

  window.__gk = { get pegs() { return pegs; }, get phase() { return phase; }, get power() { return power; }, get mistakes() { return mistakes; }, get level() { return level; }, get prob() { return prob; }, fire, useOwlPower, startLevel };

  let started = false;
  function start(data) {
    if (started) return; started = true;
    let n = data && data.level >= 1 && data.level <= LEVELS.length ? data.level : save.unlocked;
    applyTheme(); $("coins").textContent = save.coins;
    resize(); startLevel(Math.min(n, save.unlocked)); requestAnimationFrame(loop);
  }
  try { window.claude?.hot?.snapshot?.(() => ({ level })); } catch (e) {}
  start(window.claude?.hot?.data ?? {});
})();
</script>
